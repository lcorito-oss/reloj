<style>
:root{color-scheme:dark;--bg:#000;--band:#000;--arc:#454545;--txt:#8a8a8a;--day:#ff3b5c;--mon:#4da3ff;--wk:#3ddc84;--glow:#3ddc84}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1{font-family:'Poppins','Segoe UI',sans-serif;font-style:italic;font-weight:300;font-size:clamp(1.4rem,5vw,2.2rem);letter-spacing:1px}
svg{width:min(92vw,66vh,460px);height:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .25s ease-out}
svg:focus-visible{outline:2px solid var(--glow);outline-offset:6px;border-radius:50%}
#info{font:600 15px/1.2 'Segoe UI',sans-serif;color:#aaa;letter-spacing:.5px;text-align:center;min-height:1em}
#tools{display:flex;gap:10px;opacity:0;transition:opacity .3s}
#tools:hover,#tools:focus-within{opacity:1}
#tools button{padding:6px 11px;font-size:15px;border-radius:50%;opacity:.7;line-height:1}
#tools button:hover{opacity:1}
#tools.edit{opacity:1}
#txt{display:none;background:#111;color:#eee;border:1px solid #444;border-radius:16px;padding:6px 12px;font:14px 'Segoe UI',sans-serif;width:150px;outline:none}
#tools.edit #txt{display:block}
#txt:focus{border-color:var(--glow)}
#glow feFlood,#bglow feFlood{flood-color:var(--glow)}
@media (prefers-reduced-motion:reduce){.ring{transition:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (hover:none){#tools{opacity:1}}
.ring{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
text{font-family:'Segoe UI',Tahoma,sans-serif;fill:var(--txt);text-anchor:middle;dominant-baseline:central}
text.on{font-weight:700}
#rDay text,#rMon text,#rWk text{opacity:.35;filter:blur(.35px);font-size:6.5px;transition:opacity .6s,font-size .6s}
#rDay text.on,#rMon text.on,#rWk text.on{opacity:1;filter:none;font-size:14px}
.data,.live,.intro,.avatar{transition:opacity .8s}
.data,.live{opacity:0}
svg.go .data,svg.go .live{opacity:1}
svg.go .intro,svg.go .avatar{opacity:0}
#aS,#aM,#aH{opacity:0;transition:opacity .8s}
svg.bD #aS,svg.bM #aM,svg.bW #aH{opacity:1}
.intro text,#spin text{fill:#a9a9a9;font-weight:600}
#spin text{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:14px;fill:#c9c9c9}
.nums text{fill:#ccc;font-weight:600;font-size:13px}
.nums text:nth-child(2){fill:var(--day)}
.nums text:nth-child(3){fill:var(--mon)}
.nums text:nth-child(4){fill:var(--wk)}
#intro text{transition:fill .6s,opacity .6s}
#gD text{fill:var(--day)}
#gM text{fill:var(--mon)}
#gW text{fill:var(--wk)}
#gD text,#gM text,#gW text{opacity:.7}
#intro .lit text{opacity:1}
#gD.lit text{fill:var(--day);font-weight:700}
#gM.lit text{fill:var(--mon);font-weight:700}
#gW.lit text{fill:var(--wk);font-weight:700}
button{background:#1b1b1b;color:#bbb;border:1px solid #444;border-radius:20px;padding:8px 18px;font:13px 'Segoe UI',sans-serif;cursor:pointer}
button:hover{border-color:#888;color:#fff}
/* manecillas = color del anillo correspondiente */
#hS{stroke:var(--day);filter:url(#glowS)}
#hM{stroke:var(--mon);filter:url(#glowM)}
#hH{stroke:var(--wk);filter:url(#glowH)}
#glowS feFlood{flood-color:var(--day)}
#glowM feFlood{flood-color:var(--mon)}
#glowH feFlood{flood-color:var(--wk)}
/* borde resaltado en la banda seleccionada de cada anillo */
#aS{filter:url(#edgeS)}
#aM{filter:url(#edgeM)}
#aH{filter:url(#edgeH)}
#edgeS feFlood{flood-color:var(--day)}
#edgeM feFlood{flood-color:var(--mon)}
#edgeH feFlood{flood-color:var(--wk)}
#face{filter:url(#neon)}
#neon feFlood{flood-color:#1f6bff}
#spin text{fill:#1f6bff}
#info,#info span{color:#1f6bff!important}
:root{--bg:#080d18;--band:#101a29;--arc:#31425c;--txt:#cbd5e1;color-scheme:dark}
html,body{min-height:100%;height:auto}
body{min-height:100svh;justify-content:center;gap:0;overflow-x:hidden;overflow-y:auto;padding:max(28px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0%,#1d2c48 0%,#0c1423 42%,#080d18 78%);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background:radial-gradient(circle at 12% 24%,#91baff22 0 1px,transparent 2px),radial-gradient(circle at 83% 18%,#91baff1c 0 1px,transparent 2px),radial-gradient(circle at 74% 77%,#91baff18 0 1px,transparent 2px);background-size:190px 190px,230px 230px,270px 270px}
.app-shell{position:relative;width:min(100%,980px);margin:auto}
.app-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:0 0 22px;padding:0 4px}
.eyebrow,.section-kicker{color:#91baff;font-size:.72rem;font-weight:750;letter-spacing:.18em;text-transform:uppercase}
h1{margin-top:10px;color:#f3f7ff;font-size:clamp(1.8rem,4vw,3rem);font-style:normal;font-weight:650;letter-spacing:-.045em;line-height:1.05}
.lede{margin-top:10px;max-width:38rem;color:#9eacc2;font-size:.96rem;line-height:1.6}
.header-badge{flex:none;display:flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid #ffffff17;border-radius:999px;background:#ffffff08;color:#c6d2e5;font-size:.82rem}
.header-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:#67e8a5;box-shadow:0 0 14px #67e8a588}
.clock-panel{display:grid;grid-template-columns:minmax(280px,1.05fr) minmax(300px,.95fr);align-items:center;gap:clamp(16px,4vw,54px);padding:clamp(20px,4vw,46px);border:1px solid #ffffff18;border-radius:30px;background:linear-gradient(145deg,#ffffff0b,#ffffff04 62%);box-shadow:0 28px 90px #0007,inset 0 1px #ffffff0c;backdrop-filter:blur(18px)}
.clock-stage{display:grid;place-items:center;min-width:0;padding:10px;border-radius:50%;background:radial-gradient(circle,#1c2a42 0%,#111b2d 56%,transparent 72%)}
#clock{display:block;width:min(100%,440px);max-height:none;filter:drop-shadow(0 18px 36px #0006)}
#clock:focus-visible{outline:2px solid #91baff;outline-offset:8px}
.clock-details{min-width:0;padding:8px 0}
.section-kicker{margin-bottom:15px;color:#71839f}
#info{min-height:1.5em;color:#f2f6ff!important;font-size:clamp(1.3rem,2.4vw,1.85rem);font-weight:600;letter-spacing:-.025em;line-height:1.4;text-align:left}
#info span{color:#f2f6ff!important}
.details-copy{margin-top:13px;max-width:25rem;color:#9eacc2;font-size:.92rem;line-height:1.7}
.ring-legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:25px 0 28px}
.legend-item{display:flex;align-items:center;gap:8px;color:#c2cede;font-size:.78rem}
.legend-dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--dot);box-shadow:0 0 12px color-mix(in srgb,var(--dot),transparent 45%)}
#tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;opacity:1}
#tools button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:72px;padding:10px 6px;border:1px solid #ffffff18;border-radius:17px;background:#ffffff08;color:#f2f6ff;font-size:1.2rem;opacity:1;transition:background .18s,border-color .18s,transform .18s}
#tools button::after{content:attr(data-label);color:#aebbd0;font-size:.67rem;font-weight:600;letter-spacing:.01em}
#tools button:hover{transform:translateY(-2px);border-color:#91baff70;background:#91baff14;color:#fff}
#tools button:focus-visible,#txt:focus-visible{outline:2px solid #91baff;outline-offset:3px}
#tools button[aria-pressed="true"]{border-color:#67e8a566;background:#67e8a512}
#txt{grid-column:1/-1;width:100%;min-height:42px;padding:10px 13px;border-radius:12px;background:#0b1321;color:#f2f6ff;font:inherit}
#txt::placeholder{color:#7d8ca2}
.app-footer{display:flex;justify-content:space-between;gap:18px;margin-top:16px;padding:0 6px;color:#7f8da4;font-size:.76rem;line-height:1.5}
.app-footer strong{color:#aab8cc;font-weight:600}
#face{filter:url(#neon)}
#neon feFlood{flood-color:#7fb9ff}
#spin text{fill:#7fb9ff}
#info,#info span{color:#f2f6ff!important}
@media(max-width:700px){body{padding-left:14px;padding-right:14px}.app-header{align-items:flex-start;flex-direction:column;gap:16px}.header-badge{align-self:flex-start}.clock-panel{grid-template-columns:1fr;gap:4px;border-radius:24px;padding:18px}.clock-stage{width:min(100%,430px);margin:auto;padding:0}.clock-details{padding:0 4px 4px}.section-kicker{margin-bottom:8px}#info{min-height:2.8em}.ring-legend{margin:18px 0 20px}.app-footer{flex-direction:column;gap:3px}}
@media(max-width:390px){#tools{grid-template-columns:repeat(2,minmax(0,1fr))}.ring-legend{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){#tools button{transition:none}}


.moon-card{display:grid;grid-template-columns:58px minmax(0,1fr);align-items:center;gap:15px;margin-top:22px;padding:16px;border:1px solid #ffffff16;border-radius:18px;background:linear-gradient(135deg,#b9d6ff12,#ffffff04)}
.moon-symbol{display:block;width:54px;height:54px;padding:5px;border:1px solid #dbeafe22;border-radius:16px;background:#0b1321}
.moon-content{min-width:0}
.moon-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.moon-label{color:#91baff;font-size:.65rem;font-weight:750;letter-spacing:.16em}
.moon-illumination{color:#b9c8dd;font-size:.72rem;font-variant-numeric:tabular-nums}
.moon-name{display:block;margin-top:5px;color:#f2f6ff;font-size:1.05rem;font-weight:650}
.moon-meter{height:5px;overflow:hidden;margin-top:9px;border-radius:99px;background:#ffffff15}
.moon-meter span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#83aef3,#e4efff);transition:width .5s ease}
.moon-age{margin-top:6px;color:#8e9db3;font-size:.69rem}
@media(max-width:390px){.moon-card{grid-template-columns:48px minmax(0,1fr);gap:11px;padding:13px}.moon-symbol{width:46px;height:46px;padding:4px}.moon-header{align-items:flex-start;flex-direction:column;gap:3px}}
@media(prefers-reduced-motion:reduce){.moon-meter span{transition:none}}

#tools{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility .25s ease}
#tools.controls-visible,#tools:focus-within,#tools.edit{opacity:1;visibility:visible;pointer-events:auto}

@media (pointer:coarse){#hS{filter:none}}

/* Bloque lunar inspirado en la vista de Luna llena */
.moon-card{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(115px,.7fr) minmax(0,1.3fr);align-items:center;gap:clamp(12px,2vw,24px);margin-top:24px;padding:clamp(16px,2.3vw,24px);overflow:hidden;border:1px solid #ffffff18;border-radius:24px;background:radial-gradient(ellipse at 22% 50%,#8295b425 0,transparent 43%),linear-gradient(140deg,#090d16f2,#0a0f19ed);box-shadow:0 18px 48px #0005,inset 0 1px #ffffff0d}
.moon-card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.6;pointer-events:none;background-image:radial-gradient(circle at 8% 18%,#dce8ff 0 1px,transparent 1.6px),radial-gradient(circle at 28% 80%,#dce8ff 0 .8px,transparent 1.4px),radial-gradient(circle at 47% 12%,#dce8ff 0 .7px,transparent 1.5px),radial-gradient(circle at 89% 27%,#dce8ff 0 1px,transparent 1.8px),radial-gradient(circle at 74% 89%,#dce8ff 0 .8px,transparent 1.5px)}
.moon-visual{display:grid;place-items:center;min-width:0;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#e7e3d180 0 28%,#d5d9e033 42%,transparent 72%)}
.moon-symbol{display:block;width:min(100%,176px);height:auto;overflow:visible;filter:drop-shadow(0 0 10px #e5e3d566) drop-shadow(0 0 26px #d6d9df38)}
.moon-photo{filter:brightness(1.12) contrast(1.04) saturate(.42)}
.moon-content{min-width:0;padding:2px 0}
.moon-label{display:block;color:#aebbd0;font-size:.66rem;font-weight:750;letter-spacing:.19em}
.moon-name{display:block;margin-top:5px;color:#f2f4fa;font-family:Georgia,'Times New Roman',serif;font-size:clamp(1.4rem,3.5vw,2.1rem);font-weight:500;letter-spacing:-.035em;line-height:1.12}
.moon-date{margin-top:9px;color:#a1adbf;font-size:.82rem;line-height:1.4}
.moon-place{margin-top:3px;color:#78869c;font-size:.75rem}
.moon-stats{display:grid;gap:7px;margin-top:16px}
.moon-stats div{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#9ba8bc;font-size:.82rem}
.moon-stats strong{color:#eef1f7;font-size:.88rem;font-weight:550;font-variant-numeric:tabular-nums}
.moon-illumination{display:none}
.moon-age{display:none}
.moon-meter{height:4px;margin-top:12px;background:#ffffff19}
.moon-meter span{background:linear-gradient(90deg,#9aa9c2,#f4f2e9);box-shadow:0 0 10px #e4e6ed55}
@media(max-width:700px){.moon-card{grid-template-columns:minmax(96px,.55fr) minmax(0,1.45fr);gap:13px;margin-top:18px;padding:16px}.moon-symbol{width:min(100%,142px)}}
@media(max-width:390px){.moon-card{grid-template-columns:82px minmax(0,1fr);gap:10px;padding:13px;border-radius:19px}.moon-symbol{width:82px}.moon-name{font-size:1.35rem}.moon-date{font-size:.74rem}.moon-place{font-size:.68rem}.moon-stats{margin-top:12px}.moon-stats div{font-size:.73rem}}
@media(prefers-reduced-motion:reduce){.moon-meter span{transition:none}}

/* Cielo estrellado de fondo en toda la página */
body{background-color:#050811;background-image:radial-gradient(ellipse at 50% 5%,#17223a 0%,#0a101d 48%,#050811 100%)}
body::before{z-index:0;inset:0;opacity:.72;background-image:radial-gradient(1px 1px at 7% 12%,#e7efff 99%,transparent),radial-gradient(1px 1px at 19% 67%,#cad8f4 99%,transparent),radial-gradient(1.3px 1.3px at 31% 28%,#fff 99%,transparent),radial-gradient(1px 1px at 44% 82%,#cbdcff 99%,transparent),radial-gradient(1.2px 1.2px at 57% 17%,#edf3ff 99%,transparent),radial-gradient(1px 1px at 68% 58%,#d8e2f8 99%,transparent),radial-gradient(1.4px 1.4px at 79% 31%,#fff 99%,transparent),radial-gradient(1px 1px at 92% 76%,#d6e3ff 99%,transparent),radial-gradient(ellipse at 18% 32%,#6378a512,transparent 42%),radial-gradient(ellipse at 81% 66%,#536caa10,transparent 44%);background-size:173px 191px,227px 239px,283px 269px,317px 331px,359px 307px,389px 367px,431px 397px,463px 443px,100% 100%,100% 100%;background-position:0 0,23px 41px,71px 5px,119px 69px,39px 101px,157px 19px,83px 177px,211px 131px,center,center;pointer-events:none}
.app-shell{z-index:1}
</style>

<body>
<main class="app-shell">
  <section class="clock-panel" aria-label="Reloj y calendario circular">
    <div class="clock-stage">
<svg id="clock" viewBox="0 0 400 400" role="button" tabindex="0" aria-label="Reloj interactivo. Activa para repetir la presentación.">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bglow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feFlood flood-opacity=".45"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowM" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowH" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="edgeS" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="d"/>
      <feFlood/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="edgeM" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="d"/>
      <feFlood/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="edgeH" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.6" result="d"/>
      <feFlood/>
      <feComposite in2="d" operator="in" result="o"/>
      <feMerge><feMergeNode in="o"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neon" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feFlood/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="196" fill="#0b1422"/>
  <g fill="none" stroke="var(--band)" stroke-width="11">
    <circle cx="200" cy="200" r="178"/><circle cx="200" cy="200" r="138"/>
    <circle cx="200" cy="200" r="100"/><circle cx="200" cy="200" r="64" stroke-width="16"/>
  </g>
  <!-- guías tenues de las bandas -->
  <g fill="none" stroke="#2a2a2a" stroke-width=".6">
    <circle cx="200" cy="200" r="167"/><circle cx="200" cy="200" r="145"/>
    <circle cx="200" cy="200" r="123"/><circle cx="200" cy="200" r="101"/>
  </g>
  <!-- bandas grises: segundos / minutos / horas -->
  <g fill="none" stroke="var(--arc)" stroke-width="22" filter="url(#bglow)">
    <circle id="aS" cx="200" cy="200" r="178"/>
    <circle id="aM" cx="200" cy="200" r="156"/>
    <circle id="aH" cx="200" cy="200" r="134"/>
  </g>
  <!-- rótulos de presentación -->
  <g class="intro" id="intro">
    <g id="gD" class="ring" style="transform-origin:200px 200px"></g>
    <g id="gM" class="ring" style="transform-origin:200px 200px"></g>
    <g id="gW" class="ring" style="transform-origin:200px 200px"></g>
  </g>
  <!-- Hell-OW girando -->
  <g id="spin"></g>
  <!-- datos del calendario -->
  <g class="data">
    <g id="rDay" class="ring" style="transform-origin:200px 200px"></g>
    <g id="rMon" class="ring" style="transform-origin:200px 200px"></g>
    <g id="rWk" class="ring" style="transform-origin:200px 200px"></g>
  </g>
  <circle cx="200" cy="200" r="96" fill="#0b1422"/>
  <circle id="face" cx="200" cy="200" r="96" fill="none" stroke="#cfe8ff" stroke-width="1.6"/>

<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('clock');
let dim=0;
const months=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const wk=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];

function txt(g,t,r,size,angle,color){
  const el=document.createElementNS(NS,'text');
  el.textContent=t;el.setAttribute('x',200);el.setAttribute('y',200-r);
  el.setAttribute('font-size',size);
  el.setAttribute('transform',`rotate(${angle} 200 200)`);
  if(color)el.dataset.c=color;
  g.appendChild(el);
}
function build(id,data,r,size,color){
  data.forEach((t,i)=>txt(document.getElementById(id),t,r,size,i*360/data.length,color));
}
function buildDays(n){document.getElementById('rDay').innerHTML='';build('rDay',Array.from({length:n},(_,i)=>String(i+1)),178,10,'var(--day)');dim=n;}
build('rMon',months,156,11,'var(--mon)');
build('rWk',wk,134,10,'var(--wk)');

// presentación: letras separadas sobre el arco superior
function label(word,r,size,sp,gid='intro'){
  const g=document.getElementById(gid), n=word.length, step=sp/r*180/Math.PI;
  [...word].forEach((c,i)=>{ if(c!==' ')txt(g,c,r,size,(i-(n-1)/2)*step); });
}
label('DÍA',178,11,20,'gD');
label('MES',156,11,18,'gM');
label('DÍA SEMANA',134,10,14,'gW');
let spinText='HELL-OW';try{spinText=localStorage.getItem('relojText')||spinText;}catch(e){}
function setSpinText(t){document.getElementById('spin').innerHTML='';label(t,112,14,Math.min(14,2*Math.PI*112/(t.length+1)),'spin');}
setSpinText(spinText);

function mark(id,idx){
  [...document.getElementById(id).children].forEach((el,i)=>{
    el.classList.toggle('on',i===idx);
    el.style.fill=i===idx?el.dataset.c:'';
  });
}
function rot(id,idx,n){document.getElementById(id).style.transform=`rotate(${-idx*360/n}deg)`;}

function setCalendar(){
  const d=new Date(), day=d.getDate()-1, m=d.getMonth(), w=d.getDay();
  const n=new Date(d.getFullYear(),m+1,0).getDate();
  if(n!==dim)buildDays(n);
  band('aS',178,day*360/n+offs.D,360/n);band('aM',156,m*30+offs.M,30);band('aH',134,w*360/7+offs.W,360/7);
  mark('rDay',day);mark('rMon',m);mark('rWk',w);
}
// banda gris: arco de 180° que termina en el ángulo de la manecilla
function band(id,r,deg,span){
  const c=2*Math.PI*r, e=document.getElementById(id);
  e.setAttribute('stroke-dasharray',`${c*span/360} ${c}`);
  e.setAttribute('transform',`rotate(${deg-span/2-90} 200 200)`);
}
function tick(){
  const d=new Date(), sec=d.getSeconds(), s=RM?sec:sec+d.getMilliseconds()/1000,
        m=d.getMinutes()+s/60, h=(d.getHours()%12)+m/60;
  if(sec!==lastS){lastS=sec;if(soundOn)tickSound();}
  const set=(id,a)=>document.getElementById(id).setAttribute('transform',`rotate(${a} 200 200)`);
  set('hS',s*6);set('hM',m*6);set('hH',h*30);
  set('spin',(Date.now()/1000*6)%360);
  if(RM)setTimeout(tick,1000-(Date.now()%1000));
  else requestAnimationFrame(tick);
}
let hover=false, posMode=true, resetT;
const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');
let RM=motionQuery.matches;
let ac,soundOn=false,lastS=-1,wl=null,themeIdx=0;
const info=document.getElementById('info');
function updateText(){
  const d=new Date();
  const date=new Intl.DateTimeFormat('es',{weekday:'long',day:'numeric',month:'long'}).format(d);
  const dateText=date.charAt(0).toUpperCase()+date.slice(1);
  const time=d.toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit',hour12:true});
  info.textContent=`${dateText} · ${time}`;
  svg.setAttribute('aria-label',`${dateText}, ${time}. Reloj analógico interactivo. Activa para repetir la presentación.`);
}
const MOON_CYCLE_DAYS=29.530588853;
const REFERENCE_NEW_MOON=Date.UTC(2000,0,6,18,14);
function updateMoonPhase(){
  const now=new Date();
  const days=(Date.now()-REFERENCE_NEW_MOON)/86400000;
  const phase=((days/MOON_CYCLE_DAYS)%1+1)%1;
  const age=phase*MOON_CYCLE_DAYS;
  const illumination=Math.round((1-Math.cos(2*Math.PI*phase))*50);
  let name;
  if(phase<.03||phase>=.97){name='Luna nueva';}
  else if(phase<.22){name='Luna creciente';}
  else if(phase<.28){name='Cuarto creciente';}
  else if(phase<.47){name='Gibosa creciente';}
  else if(phase<.53){name='Luna llena';}
  else if(phase<.72){name='Gibosa menguante';}
  else if(phase<.78){name='Cuarto menguante';}
  else{name='Luna menguante';}
  const cosine=Math.cos(2*Math.PI*phase), waxing=phase<.5, radius=44, center=50;
  const terminatorRadius=Math.max(.001,Math.abs(cosine)*radius);
  const outerSweep=waxing?1:0, innerSweep=waxing?(cosine<0?1:0):(cosine<0?0:1);
  const moonPath=`M ${center} ${center-radius} A ${radius} ${radius} 0 0 ${outerSweep} ${center} ${center+radius} A ${terminatorRadius} ${radius} 0 0 ${innerSweep} ${center} ${center-radius} Z`;
  document.getElementById('moon-lit').setAttribute('d',moonPath);
  document.getElementById('moon-name').textContent=name;
  document.getElementById('moon-trend').textContent=phase<.5?'Creciente':'Menguante';
  document.getElementById('moon-illumination').textContent=`${illumination}%`;
  document.getElementById('moon-age').textContent=`${age.toLocaleString('es',{minimumFractionDigits:1,maximumFractionDigits:1})} días`;
  const meter=document.getElementById('moon-meter');
  meter.setAttribute('aria-valuenow',String(illumination));
  meter.setAttribute('aria-valuetext',`${illumination}% iluminada`);
  document.getElementById('moon-meter-fill').style.width=`${illumination}%`;
}
function tickSound(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.value=lastS%2?1400:1100;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05);}
const THEMES = [
  {"d":"#ff3b5c","m":"#4da3ff","w":"#3ddc84","g":"#4da3ff"},
  {"d":"#ffb86b","m":"#b79cff","w":"#54e0e0","g":"#b79cff"},
  {"d":"#ff7489","m":"#72b7ff","w":"#62e69a","g":"#72b7ff"}
];
function neonTheme(){return THEMES[Math.floor(Math.random()*THEMES.length)];}
function applyTheme(t){const s=document.documentElement.style;s.setProperty('--day',t.d);s.setProperty('--mon',t.m);s.setProperty('--wk',t.w);s.setProperty('--glow',t.g);}
const tools=document.getElementById('tools'), tin=document.getElementById('txt');
const appShell=document.querySelector('.app-shell');
let controlsTimer, skipClockClick=false;
function showControls(){
  tools.classList.add('controls-visible');
  clearTimeout(controlsTimer);
  controlsTimer=setTimeout(()=>{if(!tools.matches(':focus-within'))tools.classList.remove('controls-visible');},5000);
}
appShell.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')showControls();},{passive:true});
appShell.addEventListener('focusin',showControls);
tools.addEventListener('focusout',()=>setTimeout(()=>{if(!tools.matches(':focus-within'))showControls();},0));
document.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch'&&e.pointerType!=='pen')return;
  const wasVisible=tools.classList.contains('controls-visible')||tools.matches(':focus-within');
  showControls();
  if(!wasVisible&&e.target.closest?.('#clock')){
    skipClockClick=true;
    setTimeout(()=>{skipClockClick=false;},700);
  }
},{passive:true});
const bText=document.getElementById('bText');
bText.setAttribute('aria-expanded','false');
bText.addEventListener('click',()=>{
  const on=tools.classList.toggle('edit');
  bText.setAttribute('aria-expanded',String(on));
  if(on){tin.value=spinText;tin.focus();tin.select();}
});
function applyText(){const t=tin.value.trim().slice(0,24)||'HELL-OW';spinText=t;setSpinText(t);try{localStorage.setItem('relojText',t);}catch(e){}}
tin.addEventListener('input',applyText);
tin.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){tools.classList.remove('edit');bText.setAttribute('aria-expanded','false');tin.blur();}});
document.getElementById('bTheme').addEventListener('click',()=>{applyTheme(neonTheme());});
const bS=document.getElementById('bSound');
bS.setAttribute('aria-pressed','false');
bS.addEventListener('click',()=>{soundOn=!soundOn;try{if(soundOn&&!ac){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(AudioContextClass)ac=new AudioContextClass();else soundOn=false;}if(ac&&ac.state==='suspended')ac.resume();}catch(e){soundOn=false;}bS.textContent=soundOn?'🔊':'🔇';bS.setAttribute('aria-pressed',String(soundOn));bS.setAttribute('aria-label',soundOn?'Desactivar sonido tic tac':'Activar sonido tic tac');bS.title=soundOn?'Desactivar sonido':'Activar sonido';});
const bF=document.getElementById('bFull'), canFull=!!document.fullscreenEnabled, canWake='wakeLock' in navigator;
bF.setAttribute('aria-pressed','false');
if(!canFull&&!canWake)bF.style.display='none';
async function wake(on){try{if(on&&canWake&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}else if(!on&&wl){await wl.release();wl=null;}}catch(e){}}
bF.addEventListener('click',async()=>{
  const on=bF.dataset.on!=='1';bF.dataset.on=on?'1':'0';bF.setAttribute('aria-pressed',String(on));
  try{if(canFull){if(on)await document.documentElement.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen();}}catch(e){}
  wake(on);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&bF.dataset.on==='1')wake(true);});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&bF.dataset.on==='1'){bF.dataset.on='0';bF.setAttribute('aria-pressed','false');wake(false);}});
if(!RM){
  document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;svg.style.transform=`perspective(900px) rotateY(${x*12}deg) rotateX(${-y*12}deg)`;});
  document.documentElement.addEventListener('pointerleave',()=>{svg.style.transform='';});
}
const IDS=['gD','gM','gW'];
const offs={D:0,M:0,W:0};
function targets(){const d=new Date();return {gD:(d.getDate()-1)*360/dim+offs.D,gM:d.getMonth()*30+offs.M,gW:d.getDay()*360/7+offs.W};}
function randomize(){
  offs.D=Math.random()*360;offs.M=Math.random()*360;offs.W=Math.random()*360;
  [['rDay','D'],['rMon','M'],['rWk','W']].forEach(([id,k])=>{const g=document.getElementById(id);g.style.transition='none';g.style.transform=`rotate(${offs[k]}deg)`;void g.getBoundingClientRect();g.style.transition='';});
  applyTheme(neonTheme());setCalendar();
}
function hoverOn(){
  hover=true;clearTimeout(resetT);const t=targets();
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.add('lit');g.style.transform=`rotate(${posMode?t[id]:360}deg)`;});
  if(!posMode)resetT=setTimeout(()=>IDS.forEach(id=>{
    const g=document.getElementById(id);g.style.transition='none';g.style.transform='rotate(0deg)';
    void g.getBoundingClientRect();g.style.transition='';
  }),1300);
}
function hoverOff(){
  hover=false;clearTimeout(resetT);
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.remove('lit');g.style.transition='';g.style.transform='rotate(0deg)';});
}
let seqT=[];
function later(fn,ms){seqT.push(setTimeout(fn,ms));}
function play(){
  seqT.forEach(clearTimeout);seqT=[];
  hover=false;clearTimeout(resetT);
  svg.classList.remove('go','bD','bM','bW');
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.remove('lit');g.style.transition='none';g.style.transform='rotate(0deg)';void g.getBoundingClientRect();g.style.transition='';});
  if(RM){setCalendar();svg.classList.add('go');return;}
  randomize();
  const t=targets();
  const step=(id,cls,at)=>{
    later(()=>{const g=document.getElementById(id);g.classList.add('lit');g.style.transform=`rotate(${t[id]+360}deg)`;},at);
    later(()=>svg.classList.add(cls),at+900);
  };
  step('gD','bD',800);step('gM','bM',2400);step('gW','bW',4000);
  later(()=>{setCalendar();svg.classList.add('go');},6200);
}

applyTheme(neonTheme());setCalendar();updateText();updateMoonPhase();setInterval(setCalendar,30000);setInterval(updateText,60*1000);setInterval(updateMoonPhase,30*60*1000);tick();play();
let touchIntro=false,lastPointerType='';
svg.addEventListener('pointerdown',e=>{lastPointerType=e.pointerType;});
svg.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'&&!RM&&!svg.classList.contains('go'))hoverOn();});
svg.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hoverOff();});
svg.addEventListener('click',e=>{
  if(skipClockClick){skipClockClick=false;e.preventDefault();return;}
  if(e.detail>0&&lastPointerType==='touch'&&!svg.classList.contains('go')){
    touchIntro=!touchIntro;
    if(touchIntro)hoverOn();else hoverOff();
    return;
  }
  touchIntro=false;play();
});
svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play();}});
motionQuery.addEventListener?.('change',e=>{RM=e.matches;if(RM)play();});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
