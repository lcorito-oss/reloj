<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clock Modern Way</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reloj">
<meta property="og:title" content="Clock Modern Way">
<meta property="og:image" content="icon-512.png">

<link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--band:#000;--arc:#454545;--txt:#8a8a8a;--day:#ff3b5c;--mon:#4da3ff;--wk:#3ddc84;--glow:#3ddc84}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;overflow:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h1{font-family:'Poppins','Segoe UI',sans-serif;font-style:italic;font-weight:300;font-size:clamp(1.4rem,5vw,2.2rem);letter-spacing:1px}
svg{width:min(92vw,66vh,460px);height:auto;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .25s ease-out}
#info{font:14px/1.2 'Segoe UI',sans-serif;color:#aaa;letter-spacing:.5px;text-align:center;min-height:1em}
#tools{display:flex;gap:10px;opacity:0;transition:opacity .3s}
#tools:hover,#tools:focus-within{opacity:1}
#tools button{padding:6px 11px;font-size:15px;border-radius:50%;opacity:.7;line-height:1}
#tools button:hover{opacity:1}
#tools.edit{opacity:1}
#txt{display:none;background:#111;color:#eee;border:1px solid #444;border-radius:16px;padding:6px 12px;font:14px 'Segoe UI',sans-serif;width:150px;outline:none}
#tools.edit #txt{display:block}
#txt:focus{border-color:var(--glow)}
#glow feFlood,#bglow feFlood{flood-color:var(--glow)}
@media (prefers-reduced-motion:reduce){.ring{transition:none}}
.ring{transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
text{font-family:'Segoe UI',Tahoma,sans-serif;fill:var(--txt);text-anchor:middle;dominant-baseline:central}
text.on{font-weight:700}
#rDay text,#rMon text,#rWk text{opacity:.35;filter:blur(.35px);font-size:6.5px;transition:opacity .6s,font-size .6s}
#rDay text.on,#rMon text.on,#rWk text.on{opacity:1;filter:none;font-size:14px}
.data,.live,.intro,.avatar{transition:opacity .8s}
.data,.live{opacity:0}
svg.go .data,svg.go .live{opacity:1}
svg.go .intro,svg.go .avatar{opacity:0}
#aS,#aM,#aH{opacity:0;transition:opacity .8s}
svg.bD #aS,svg.bM #aM,svg.bW #aH{opacity:1}
.intro text,#spin text{fill:#a9a9a9;font-weight:600}
#spin text{font-family:'Pirata One','Metal Mania',serif;font-weight:400;font-size:14px;fill:#c9c9c9}
.nums text{fill:#ccc;font-weight:600;font-size:13px}
.nums text:nth-child(2){fill:var(--day)}
.nums text:nth-child(3){fill:var(--mon)}
.nums text:nth-child(4){fill:var(--wk)}
#intro text{transition:fill .6s,opacity .6s}
#gD text{fill:var(--day)}
#gM text{fill:var(--mon)}
#gW text{fill:var(--wk)}
#gD text,#gM text,#gW text{opacity:.7}
#intro .lit text{opacity:1}
#gD.lit text{fill:var(--day);font-weight:700}
#gM.lit text{fill:var(--mon);font-weight:700}
#gW.lit text{fill:var(--wk);font-weight:700}
button{background:#1b1b1b;color:#bbb;border:1px solid #444;border-radius:20px;padding:8px 18px;font:13px 'Segoe UI',sans-serif;cursor:pointer}
button:hover{border-color:#888;color:#fff}
</style>
</head>
<body>
<svg id="clock" viewBox="0 0 400 400" aria-label="Reloj (clic para repetir la presentación)">

    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bglow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feFlood flood-opacity=".45"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="196" fill="#000"/>

  </g>

  <g fill="none" stroke="#2a2a2a" stroke-width=".6">
    <circle cx="200" cy="200" r="167"/><circle cx="200" cy="200" r="145"/>
    <circle cx="200" cy="200" r="123"/><circle cx="200" cy="200" r="101"/>
  </g>
  <!-- bandas grises: segundos / minutos / horas -->
  <g fill="none" stroke="var(--arc)" stroke-width="22" filter="url(#bglow)">
    <circle id="aS" cx="200" cy="200" r="178"/>
    <circle id="aM" cx="200" cy="200" r="156"/>
    <circle id="aH" cx="200" cy="200" r="134"/>
  </g>
  <!-- rótulos de presentación -->
  <g class="intro" id="intro">
    <g id="gD" class="ring" style="transform-origin:200px 200px"></g>
    <g id="gM" class="ring" style="transform-origin:200px 200px"></g>
    <g id="gW" class="ring" style="transform-origin:200px 200px"></g>
  </g>
  <!-- Hell-OW girando -->
  <g id="spin"></g>
  <!-- datos del calendario -->
  <g class="data">
    <g id="rDay" class="ring" style="transform-origin:200px 200px"></g>
    <g id="rMon" class="ring" style="transform-origin:200px 200px"></g>
    <g id="rWk" class="ring" style="transform-origin:200px 200px"></g>
  </g>
  <circle cx="200" cy="200" r="96" fill="#000" stroke="#444" stroke-width="2"/>
  <!-- búho vectorial -->

.3,-1.8 27.2,1.7 25.4,2.9 21.7,4.5 18.1,5.2 14.3,5.2 10.1,3.1 7.7,1.3 8.1,1.1 10.9,2.1 13.9,2.5 17.8,2.2 21.3,1.1 23.2,0.1 25.9,-1.8 26.9,-2.9 24.4,-2.0 23.7,-2.1 25.9,-4.5 27.7,-8.0 28.3,-10.4 28.4,-13.0 27.6,-17.5 28.0,-17.5ZM-28.0,-17.5 -27.6,-17.5 -28.4,-13.9 -28.4,-11.2 -28.0,-9.0 -26.5,-5.3 -23.8,-2.2 -24.4,-2.0 -26.9,-2.9 -25.8,-1.7 -21.7,1.0 -16.9,2.4 -12.6,2.4 -9.8,1.8 -8.1,1.1 -7.7,1.3 -11.1,3.6 -14.3,5.2 -18.2,5.2 -20.7,4.8 -23.7,3.8 -27.0,1.8 -29.3,-0.4 -30.4,-2.1 -31.2,-3.9 -31.9,-6.7 -31.9,-9.8 -31.5,-11.8 -30.4,-14.4ZM-19.9,-34.7 -16.9,-31.7 -10.9,-27.2 -5.2,-24.1 -0.1,-22.4 4.5,-23.8 9.5,-26.3 15.4,-30.4 19.9,-34.6 16.5,-34.7 10.4,-34.0 10.2,-34.2 11.1,-34.7 16.2,-36.6 13.7,-37.5 9.9,-38.2 4.9,-38.1 2.5,-37.5 0.1,-36.6 -4.9,-38.1 -9.9,-38.2 -14.1,-37.4 -16.2,-36.6 -10.6,-34.6 -10.1,-34.2 -10.2,-34.0 -14.3,-34.6ZM-44.4,-25.5 -44.4,-23.8 -41.6,-25.9 -38.2,-27.0 -34.3,-26.9 -30.0,-25.4 -24.1,-22.0 -6.2,-9.2 -0.1,-5.9 5.9,-9.1 24.1,-22.0 31.0,-25.8 34.3,-26.9 38.2,-27.0 40.1,-26.6 42.0,-25.6 44.4,-23.8 44.1,-27.5 42.6,-33.2 40.6,-37.4 37.5,-41.7 34.6,-44.5 30.8,-47.1 26.1,-49.2 21.8,-50.0 23.7,-48.3 25.1,-46.4 26.1,-43.0 25.6,-39.2 23.8,-35.4 21.4,-32.4 18.5,-29.4 15.4,-26.9 9.7,-23.2 2.7,-20.2 -0.4,-19.5 -4.2,-20.7 -9.9,-23.4 -14.8,-26.5 -17.4,-28.4 -22.3,-33.3 -24.1,-35.9 -25.4,-38.4 -26.1,-41.0 -26.1,-43.4 -24.9,-46.6 -23.8,-48.2 -21.8,-50.0 -25.6,-49.3 -30.8,-47.1 -34.6,-44.5 -37.5,-41.7 -39.8,-38.8 -41.7,-35.3 -43.3,-31.2Z"/>
  </g>
  <!-- números 12, 3, 6 y 9 -->
  <g class="live nums" filter="url(#glow)">
    <text x="200" y="122">12</text><text x="278" y="200">3</text>

  </g>

    <line id="hH" filter="url(#glow)" x1="200" y1="200" x2="200" y2="150" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <line id="hM" filter="url(#glow)" x1="200" y1="200" x2="200" y2="132" stroke="#ddd" stroke-width="3.5" stroke-linecap="round"/>

<div id="info"></div>
<div id="tools">
  <button id="bTheme" type="button" title="Cambiar colores" aria-label="Cambiar colores">🎨</button>
  <button id="bSound" type="button" title="Sonido tic-tac" aria-label="Sonido tic-tac">🔇</button>
  <button id="bFull" type="button" title="Pantalla completa y pantalla encendida" aria-label="Pantalla completa">⛶</button>
  <button id="bText" type="button" title="Escribir tu propio texto" aria-label="Escribir tu propio texto">✏️</button>
  <input id="txt" type="text" maxlength="24" placeholder="Tu texto" aria-label="Texto que gira" autocomplete="off">
</div>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('clock');
let dim=0;
const months=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const wk=['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];

function txt(g,t,r,size,angle,color){
  const el=document.createElementNS(NS,'text');
  el.textContent=t;el.setAttribute('x',200);el.setAttribute('y',200-r);
  el.setAttribute('font-size',size);
  el.setAttribute('transform',`rotate(${angle} 200 200)`);
  if(color)el.dataset.c=color;
  g.appendChild(el);
}
function build(id,data,r,size,color){
  data.forEach((t,i)=>txt(document.getElementById(id),t,r,size,i*360/data.length,color));
}
function buildDays(n){document.getElementById('rDay').innerHTML='';build('rDay',Array.from({length:n},(_,i)=>String(i+1)),178,10,'var(--day)');dim=n;}
build('rMon',months,156,11,'var(--mon)');
build('rWk',wk,134,10,'var(--wk)');

// presentación: letras separadas sobre el arco superior
function label(word,r,size,sp,gid='intro'){
  const g=document.getElementById(gid), n=word.length, step=sp/r*180/Math.PI;
  [...word].forEach((c,i)=>{ if(c!==' ')txt(g,c,r,size,(i-(n-1)/2)*step); });
}
label('DÍA',178,11,20,'gD');
label('MES',156,11,18,'gM');
label('DÍA SEMANA',134,10,14,'gW');
let spinText='HELL-OW';try{spinText=localStorage.getItem('relojText')||spinText;}catch(e){}
function setSpinText(t){document.getElementById('spin').innerHTML='';label(t,112,14,Math.min(14,2*Math.PI*112/(t.length+1)),'spin');}
setSpinText(spinText);

function mark(id,idx){
  [...document.getElementById(id).children].forEach((el,i)=>{
    el.classList.toggle('on',i===idx);
    el.style.fill=i===idx?el.dataset.c:'';
  });
}
function rot(id,idx,n){document.getElementById(id).style.transform=`rotate(${-idx*360/n}deg)`;}

function setCalendar(){
  const d=new Date(), day=d.getDate()-1, m=d.getMonth(), w=d.getDay();
  const n=new Date(d.getFullYear(),m+1,0).getDate();
  if(n!==dim)buildDays(n);
  band('aS',178,day*360/n+offs.D,360/n);band('aM',156,m*30+offs.M,30);band('aH',134,w*360/7+offs.W,360/7);
  mark('rDay',day);mark('rMon',m);mark('rWk',w);
}
// banda gris: arco de 180° que termina en el ángulo de la manecilla
function band(id,r,deg,span){
  const c=2*Math.PI*r, e=document.getElementById(id);
  e.setAttribute('stroke-dasharray',`${c*span/360} ${c}`);
  e.setAttribute('transform',`rotate(${deg-span/2-90} 200 200)`);
}
function tick(){
  const d=new Date(), sec=d.getSeconds(), s=RM?sec:sec+d.getMilliseconds()/1000,
        m=d.getMinutes()+s/60, h=(d.getHours()%12)+m/60;
  if(sec!==lastS){lastS=sec;if(soundOn)tickSound();}
  const set=(id,a)=>document.getElementById(id).setAttribute('transform',`rotate(${a} 200 200)`);
  set('hS',s*6);set('hM',m*6);set('hH',h*30);
  if(!RM)set('spin',(Date.now()/1000*6)%360);
  requestAnimationFrame(tick);
}
let hover=false, posMode=true, resetT;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let ac,soundOn=false,lastS=-1,wl=null,themeIdx=0;
const info=document.getElementById('info');
function updateText(){const d=new Date();let s=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'});s=s.charAt(0).toUpperCase()+s.slice(1);info.textContent=s;svg.setAttribute('aria-label',s);}
function tickSound(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.value=lastS%2?1400:1100;g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05);}
const THEMES=[{d:'#ff3b5c',m:'#4da3ff',w:'#3ddc84',g:'#3ddc84'},{d:'#ff7a1a',m:'#ffd166',w:'#ff4d6d',g:'#ffb347'},{d:'#ff7ad9',m:'#7b9cff',w:'#c77dff',g:'#c77dff'},{d:'#ff6b6b',m:'#2ec4b6',w:'#9bf6ff',g:'#2ec4b6'}];
try{themeIdx=(+localStorage.getItem('relojTheme')||0)%THEMES.length;}catch(e){}
function applyTheme(i){const t=THEMES[i],s=document.documentElement.style;s.setProperty('--day',t.d);s.setProperty('--mon',t.m);s.setProperty('--wk',t.w);s.setProperty('--glow',t.g);try{localStorage.setItem('relojTheme',i);}catch(e){}}
const tools=document.getElementById('tools'), tin=document.getElementById('txt');
document.getElementById('bText').addEventListener('click',()=>{
  const on=tools.classList.toggle('edit');
  if(on){tin.value=spinText;tin.focus();tin.select();}
});
function applyText(){const t=tin.value.trim().slice(0,24)||'HELL-OW';spinText=t;setSpinText(t);try{localStorage.setItem('relojText',t);}catch(e){}}
tin.addEventListener('input',applyText);
tin.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){tools.classList.remove('edit');tin.blur();}});
document.getElementById('bTheme').addEventListener('click',()=>{themeIdx=(themeIdx+1)%THEMES.length;applyTheme(themeIdx);});
const bS=document.getElementById('bSound');
bS.addEventListener('click',()=>{soundOn=!soundOn;if(soundOn&&!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac&&ac.state==='suspended')ac.resume();bS.textContent=soundOn?'🔊':'🔇';});
const bF=document.getElementById('bFull'), canFull=!!document.fullscreenEnabled, canWake='wakeLock' in navigator;
if(!canFull&&!canWake)bF.style.display='none';
async function wake(on){try{if(on&&canWake&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}else if(!on&&wl){await wl.release();wl=null;}}catch(e){}}
bF.addEventListener('click',async()=>{
  const on=bF.dataset.on!=='1';bF.dataset.on=on?'1':'0';
  try{if(canFull){if(on)await document.documentElement.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen();}}catch(e){}
  wake(on);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&bF.dataset.on==='1')wake(true);});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&bF.dataset.on==='1'){bF.dataset.on='0';wake(false);}});
if(!RM){
  document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;svg.style.transform=`perspective(900px) rotateY(${x*12}deg) rotateX(${-y*12}deg)`;});
  document.documentElement.addEventListener('pointerleave',()=>{svg.style.transform='';});
}
const IDS=['gD','gM','gW'];
const offs={D:0,M:0,W:0};
function targets(){const d=new Date();return {gD:(d.getDate()-1)*360/dim+offs.D,gM:d.getMonth()*30+offs.M,gW:d.getDay()*360/7+offs.W};}
function randomize(){
  offs.D=Math.random()*360;offs.M=Math.random()*360;offs.W=Math.random()*360;
  [['rDay','D'],['rMon','M'],['rWk','W']].forEach(([id,k])=>{const g=document.getElementById(id);g.style.transition='none';g.style.transform=`rotate(${offs[k]}deg)`;void g.getBoundingClientRect();g.style.transition='';});
  let i;do{i=Math.floor(Math.random()*THEMES.length);}while(i===themeIdx&&THEMES.length>1);
  themeIdx=i;applyTheme(i);setCalendar();
}
function hoverOn(){
  hover=true;clearTimeout(resetT);const t=targets();
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.add('lit');g.style.transform=`rotate(${posMode?t[id]:360}deg)`;});
  if(!posMode)resetT=setTimeout(()=>IDS.forEach(id=>{
    const g=document.getElementById(id);g.style.transition='none';g.style.transform='rotate(0deg)';
    void g.getBoundingClientRect();g.style.transition='';
  }),1300);
}
function hoverOff(){
  hover=false;clearTimeout(resetT);
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.remove('lit');g.style.transition='';g.style.transform='rotate(0deg)';});
}
let seqT=[];
function later(fn,ms){seqT.push(setTimeout(fn,ms));}
function play(){
  seqT.forEach(clearTimeout);seqT=[];
  svg.classList.remove('go','bD','bM','bW');
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.remove('lit');g.style.transition='none';g.style.transform='rotate(0deg)';void g.getBoundingClientRect();g.style.transition='';});
  randomize();
  const t=targets();
  const step=(id,cls,at)=>{
    later(()=>{const g=document.getElementById(id);g.classList.add('lit');g.style.transform=`rotate(${t[id]+360}deg)`;},at);
    later(()=>svg.classList.add(cls),at+900);
  };
  step('gD','bD',800);step('gM','bM',2400);step('gW','bW',4000);
  later(()=>{setCalendar();svg.classList.add('go');},6200);
}

applyTheme(themeIdx);setCalendar();updateText();setInterval(setCalendar,30000);setInterval(updateText,1000);tick();play();
svg.addEventListener('click',play);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
