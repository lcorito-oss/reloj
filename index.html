.data,.live{opacity:0}

svg.go .intro,svg.go .avatar{opacity:0}
#aS,#aM,#aH{opacity:0;transition:opacity .8s}
svg.bD #aS,svg.bM #aM,svg.bW #aH{opacity:1}
.intro text,#spin text{fill:#a9a9a9;font-weight:600}
#spin text{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:14px;fill:#c9c9c9}
.nums text{fill:#ccc;font-weight:600;font-size:13px}
.nums text:nth-child(2){fill:var(--day)}
.nums text:nth-child(3){fill:var(--mon)}
.nums text:nth-child(4){fill:var(--wk)}
#intro text{transition:fill .6s,opacity .6s}

#gM text{fill:var(--mon)}

#gM.lit text{fill:var(--mon);font-weight:700}
#gW.lit text{fill:var(--wk);font-weight:700}
button{background:#1b1b1b;color:#bbb;border:1px solid #444;border-radius:20px;padding:8px 18px;font:13px 'Segoe UI',sans-serif;cursor:pointer}
button:hover{border-color:#888;color:#fff}
/* manecillas = color del anillo correspondiente */
#hS{stroke:var(--day);filter:url(#glowS)}
#hM{stroke:var(--mon);filter:url(#glowM)}
#hH{stroke:var(--wk);filter:url(#glowH)}
#glowS feFlood{flood-color:var(--day)}
#glowM feFlood{flood-color:var(--mon)}
#glowH feFlood{flood-color:var(--wk)}
/* borde resaltado en la banda seleccionada de cada anillo */
#aS{filter:url(#edgeS)}
#aM{filter:url(#edgeM)}
#aH{filter:url(#edgeH)}
#edgeS feFlood{flood-color:var(--day)}
#edgeM feFlood{flood-color:var(--mon)}
#edgeH feFlood{flood-color:var(--wk)}

#neon feFlood{flood-color:#1f6bff}

#info,#info span{color:#1f6bff!important}

/* Cielo estrellado de fondo en toda la página */
body{background-color:#050811;background-image:radial-gradient(ellipse at 50% 5%,#17223a 0%,#0a101d 48%,#050811 100%)}
body::before{z-index:0;inset:0;opacity:.72;background-image:radial-gradient(1px 1px at 7% 12%,#e7efff 99%,transparent),radial-gradient(1px 1px at 19% 67%,#cad8f4 99%,transparent),radial-gradient(1.3px 1.3px at 31% 28%,#fff 99%,transparent),radial-gradient(1px 1px at 44% 82%,#cbdcff 99%,transparent),radial-gradient(1.2px 1.2px at 57% 17%,#edf3ff 99%,transparent),radial-gradient(1px 1px at 68% 58%,#d8e2f8 99%,transparent),radial-gradient(1.4px 1.4px at 79% 31%,#fff 99%,transparent),radial-gradient(1px 1px at 92% 76%,#d6e3ff 99%,transparent),radial-gradient(ellipse at 18% 32%,#6378a512,transparent 42%),radial-gradient(ellipse at 81% 66%,#536caa10,transparent 44%);background-size:173px 191px,227px 239px,283px 269px,317px 331px,359px 307px,389px 367px,431px 397px,463px 443px,100% 100%,100% 100%;background-position:0 0,23px 41px,71px 5px,119px 69px,39px 101px,157px 19px,83px 177px,211px 131px,center,center;pointer-events:none}

<body>
<canvas id="sky" aria-hidden="true"></canvas>

<main class="app-shell">
  <section class="clock-panel" aria-label="Reloj y calendario circular">
    <div class="clock-stage">
<svg id="clock" viewBox="0 0 400 400" role="button" tabindex="0" aria-label="Reloj interactivo. Activa para repetir la presentación.">
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bglow" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feFlood flood-opacity=".45"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feFlood flood-opacity=".6"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>

function drawSky(){
  const canvas=document.getElementById('sky');
  if(!canvas)return;
  const width=window.innerWidth,height=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
  const cx=width/2,cy=height/2;
  const days=2444945.0-2451545; // Día juliano del cielo de referencia.
  const lst=(((280.46061837+360.98564736629*days+SKY_LON)%360)+360)%360*SKY_R;
  const horizonRadius=Math.tan(90*SKY_R/2),projected=new Map();
  for(const [hip,raDeg,decDeg,magnitude] of SKY_STARS){
    const dec=decDeg*SKY_R,ha=lst-raDeg*SKY_R;
    const alt=Math.asin(Math.max(-1,Math.min(1,Math.sin(SKY_LAT*SKY_R)*Math.sin(dec)+Math.cos(SKY_LAT*SKY_R)*Math.cos(dec)*Math.cos(ha))));
    const altDeg=alt/SKY_R;if(altDeg<0)continue;
    const cosAlt=Math.max(.0001,Math.cos(alt));
    const sinAz=-Math.cos(dec)*Math.sin(ha)/cosAlt;
    const cosAz=(Math.sin(dec)-Math.sin(alt)*Math.sin(SKY_LAT*SKY_R))/(cosAlt*Math.cos(SKY_LAT*SKY_R));
    const az=Math.atan2(sinAz,cosAz),radius=Math.tan((90-altDeg)*SKY_R/2)/horizonRadius;
    const x=cx+Math.sin(az)*radius*width/2,y=cy-Math.cos(az)*radius*height/2;
    projected.set(hip,{x,y,magnitude});
  }
  ctx.save();
  const R=SKY_R,LAT=SKY_LAT;
  const projectEquatorial=(raDeg,decDeg)=>{
    const dec=decDeg*R,ha=lst-raDeg*R;
    const alt=Math.asin(Math.max(-1,Math.min(1,Math.sin(LAT*R)*Math.sin(dec)+Math.cos(LAT*R)*Math.cos(dec)*Math.cos(ha))));
    if(alt<0)return null;
    const cosAlt=Math.max(.0001,Math.cos(alt));
    const sinAz=-Math.cos(dec)*Math.sin(ha)/cosAlt;
    const cosAz=(Math.sin(dec)-Math.sin(alt)*Math.sin(LAT*R))/(cosAlt*Math.cos(LAT*R));
    const az=Math.atan2(sinAz,cosAz),radius=Math.tan((90-alt/R)*R/2)/horizonRadius;
    const x=cx+Math.sin(az)*radius*width/2,y=cy-Math.cos(az)*radius*height/2;
    if(x < -4 || x > width+4 || y < -4 || y > height+4)return null;
    return {x,y,alt:alt/R};
  };
  // Banda difusa de la Vía Láctea: puntos del plano galáctico transformados a J2000.
  for(let b=-12;b<=12;b+=3)for(let l=0;l<360;l+=4){
    const br=b*R,lr=l*R,cb=Math.cos(br),xg=cb*Math.cos(lr),yg=cb*Math.sin(lr),zg=Math.sin(br);
    const xe=-.05487556*xg-.87343709*yg-.48383502*zg;
    const ye=.49410943*xg-.44482963*yg+.74698224*zg;
    const ze=-.86766615*xg-.19807637*yg+.45598378*zg;
    const p=projectEquatorial(Math.atan2(ye,xe)/R,Math.asin(ze)/R);
    if(!p)continue;
    ctx.globalAlpha=.035+.055*(1-Math.abs(b)/15);
    ctx.fillStyle="#9eb4ed";ctx.beginPath();ctx.arc(p.x,p.y,1.05+(1-Math.abs(b)/15)*.45,0,Math.PI*2);ctx.fill();
  }
  // Planetas y satélite natural (Luna), más galaxias destacadas por encima del horizonte.
  for(const body of SKY_BODIES){
    const p=projectEquatorial(body.ra,body.dec);if(!p)continue;
    ctx.globalAlpha=.96;ctx.fillStyle=body.color;ctx.shadowColor=body.color;ctx.shadowBlur=body.kind==="moon"?9:6;
    ctx.beginPath();ctx.arc(p.x,p.y,body.kind==="moon"?4.4:3.5,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.font="600 12px system-ui";ctx.fillText(body.name,p.x+7,p.y-6);
  }
  for(const galaxy of SKY_GALAXIES){
    const p=projectEquatorial(galaxy.ra,galaxy.dec);if(!p)continue;
    ctx.globalAlpha=.82;ctx.strokeStyle="#d4c7ff";ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(p.x,p.y,4.2,2.7,-.35,0,Math.PI*2);ctx.stroke();
    ctx.font="500 11px system-ui";ctx.fillStyle="#d4c7ff";ctx.fillText(galaxy.name,p.x+7,p.y-5);
  }
  for(const {x,y,magnitude} of projected.values()){
    const radius=Math.max(.65,Math.min(2,1.7-(magnitude+1)*.22));
    ctx.globalAlpha=Math.max(.22,Math.min(.95,.95-(magnitude+1.5)*.14));ctx.fillStyle='#dce8ff';
    ctx.shadowColor='#b8d1ff';ctx.shadowBlur=magnitude<1?5:2;ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

function txt(g,t,r,size,angle,color){
  const el=document.createElementNS(NS,'text');
  el.textContent=t;el.setAttribute('x',200);el.setAttribute('y',200-r);

function tick(){
  const d=new Date(), sec=d.getSeconds(), s=RM?sec:sec+d.getMilliseconds()/1000,
        m=d.getMinutes()+s/60, h=(d.getHours()%12)+m/60;
  if(sec!==lastS){lastS=sec;if(soundOn)tickSound();}
  const set=(id,a)=>document.getElementById(id).setAttribute('transform',`rotate(${a} 200 200)`);
  set('hS',s*6);set('hM',m*6);set('hH',h*30);
  set('spin',(Date.now()/1000*6)%360);
  if(RM)setTimeout(tick,1000-(Date.now()%1000));
  else requestAnimationFrame(tick);
}

const MOON_CYCLE_DAYS=29.530588853;
const REFERENCE_NEW_MOON=Date.UTC(2000,0,6,18,14);
function updateMoonPhase(){
  const now=new Date();
  const days=(Date.now()-REFERENCE_NEW_MOON)/86400000;
  const phase=((days/MOON_CYCLE_DAYS)%1+1)%1;
  const age=phase*MOON_CYCLE_DAYS;
  const illumination=Math.round((1-Math.cos(2*Math.PI*phase))*50);
  let name;
  if(phase<.03||phase>=.97){name='Luna nueva';}
  else if(phase<.22){name='Luna creciente';}
  else if(phase<.28){name='Cuarto creciente';}
  else if(phase<.47){name='Gibosa creciente';}
  else if(phase<.53){name='Luna llena';}
  else if(phase<.72){name='Gibosa menguante';}
  else if(phase<.78){name='Cuarto menguante';}
  else{name='Luna menguante';}
  const cosine=Math.cos(2*Math.PI*phase), waxing=phase<.5, radius=44, center=50;
  const terminatorRadius=Math.max(.001,Math.abs(cosine)*radius);
  const outerSweep=waxing?1:0, innerSweep=waxing?(cosine<0?1:0):(cosine<0?0:1);
  const moonPath=`M ${center} ${center-radius} A ${radius} ${radius} 0 0 ${outerSweep} ${center} ${center+radius} A ${terminatorRadius} ${radius} 0 0 ${innerSweep} ${center} ${center-radius} Z`;
  document.getElementById('moon-lit').setAttribute('d',moonPath);
  document.getElementById('moon-name').textContent=name;
  document.getElementById('moon-trend').textContent=phase<.5?'Creciente':'Menguante';
  document.getElementById('moon-illumination').textContent=`${illumination}%`;
  document.getElementById('moon-age').textContent=`${age.toLocaleString('es',{minimumFractionDigits:1,maximumFractionDigits:1})} días`;
  const meter=document.getElementById('moon-meter');
  meter.setAttribute('aria-valuenow',String(illumination));
  meter.setAttribute('aria-valuetext',`${illumination}% iluminada`);
  document.getElementById('moon-meter-fill').style.width=waxing?`${illumination}%`:'100%';
  document.getElementById('moon-meter-dark').style.width=waxing?'0%':`${100-illumination}%`;
}

const THEMES = [

const IDS=['gD','gM','gW'];
const offs={D:0,M:0,W:0};
function targets(){const d=new Date();return {gD:(d.getDate()-1)*360/dim+offs.D,gM:d.getMonth()*30+offs.M,gW:d.getDay()*360/7+offs.W};}
function randomize(){
  offs.D=Math.random()*360;offs.M=Math.random()*360;offs.W=Math.random()*360;
  [['rDay','D'],['rMon','M'],['rWk','W']].forEach(([id,k])=>{const g=document.getElementById(id);g.style.transition='none';g.style.transform=`rotate(${offs[k]}deg)`;void g.getBoundingClientRect();g.style.transition='';});
  applyTheme(neonTheme());setCalendar();

function hoverOn(){
  hover=true;clearTimeout(resetT);const t=targets();
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.add('lit');g.style.transform=`rotate(${posMode?t[id]:360}deg)`;});
  if(!posMode)resetT=setTimeout(()=>IDS.forEach(id=>{
    const g=document.getElementById(id);g.style.transition='none';g.style.transform='rotate(0deg)';
    void g.getBoundingClientRect();g.style.transition='';
  }),1300);
}
function hoverOff(){
  hover=false;clearTimeout(resetT);
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.remove('lit');g.style.transition='';g.style.transform='rotate(0deg)';});
}
let seqT=[];
function later(fn,ms){seqT.push(setTimeout(fn,ms));}
function play(){
  seqT.forEach(clearTimeout);seqT=[];
  hover=false;clearTimeout(resetT);
  svg.classList.remove('go','bD','bM','bW');
  IDS.forEach(id=>{const g=document.getElementById(id);g.classList.remove('lit');g.style.transition='none';g.style.transform='rotate(0deg)';void g.getBoundingClientRect();g.style.transition='';});
  if(RM){setCalendar();svg.classList.add('go');return;}
  randomize();
  const t=targets();
  const step=(id,cls,at)=>{
    later(()=>{const g=document.getElementById(id);g.classList.add('lit');g.style.transform=`rotate(${t[id]+360}deg)`;},at);
    later(()=>svg.classList.add(cls),at+900);
  };
  step('gD','bD',800);step('gM','bM',2400);step('gW','bW',4000);
  later(()=>{setCalendar();svg.classList.add('go');},6200);
}

/* ---- Google Calendar (solo lectura) ---- */
var GC_ID='270606632725-jh02rpeacl0qth2la3tfkg9ji5uqlt5f.apps.googleusercontent.com';
var GC_SCOPE='https://www.googleapis.com/auth/calendar.readonly';
var gEvents=[], gToken=null, gTokenExp=0, gClient=null, gBusy=false, gUserClick=false;
function gcPd(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function gcMsg(t){document.getElementById('gcalMsg').textContent=t||'';}
function gcLoadCache(){try{const c=JSON.parse(localStorage.getItem('relojGcalEvents')||'null');if(c&&Array.isArray(c.events))gEvents=c.events;}catch(e){}}
function gcSaveCache(){try{localStorage.setItem('relojGcalEvents',JSON.stringify({events:gEvents,at:Date.now()}));}catch(e){}}
function gcConnected(){try{return localStorage.getItem('relojGcal')==='1';}catch(e){return false;}}
function gcTokenOk(){return !!gToken&&Date.now()<gTokenExp-60000;}

function gcRender(){
  const list=document.getElementById('gcalList'), btn=document.getElementById('gcalBtn'), off=document.getElementById('gcalOff');
  list.textContent='';
  const conn=gcConnected();
  btn.textContent=conn?'Actualizar':'Conectar Google Calendar';
  off.hidden=!conn;
  const now=Date.now(), t0=new Date();t0.setHours(0,0,0,0);
  const lim=t0.getTime()+2*864e5, up=(gEvents||[]).filter(e=>(e.e>now||(e.e===e.s&&e.s>=t0.getTime()))&&e.s<lim).slice(0,8);
  up.forEach(ev=>{
    const li=document.createElement('li'), w=document.createElement('span'), ti=document.createElement('span'), sub=document.createElement('span');
    const sd=new Date(ev.s), sday=new Date(sd.getFullYear(),sd.getMonth(),sd.getDate()), diff=Math.round((sday-t0)/864e5);
    w.className='gcal-when';
    w.textContent=diff<=0?'Hoy':diff===1?'Mañana':sd.toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'}).replace('.','');
    ti.className='gcal-title';ti.textContent=ev.t;
    sub.className='gcal-sub';sub.textContent=ev.a?'':sd.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit'});
    li.appendChild(w);li.appendChild(ti);li.appendChild(sub);list.appendChild(li);
  });
  if(!conn)gcMsg('Conecta tu cuenta para ver tus citas y cumpleaños.');
  else if(!up.length)gcMsg('Sin eventos hoy ni mañana.');
  else gcMsg('');
  markEventDays();
}

function markEventDays(){
  const g=document.getElementById('rDay');if(!g)return;
  const d=new Date(),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),days=new Set();
  (gEvents||[]).forEach(ev=>{
    const e=Math.max(ev.e,ev.s+1);
    for(let i=1;i<=n;i++){if(ev.s<new Date(y,m,i+1).getTime()&&e>new Date(y,m,i).getTime())days.add(i);}
  });
  [...g.children].forEach((el,i)=>el.classList.toggle('ev',days.has(i+1)));
}

async function gcFetchAll(){
  const now=new Date(), min=new Date(now.getFullYear(),now.getMonth(),1), max=new Date(now.getTime()+35*864e5);
  const h={Authorization:'Bearer '+gToken};
  const lr=await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',{headers:h});
  if(lr.status===401){gToken=null;throw new Error('auth');}
  if(!lr.ok)throw new Error('list');
  const cals=((await lr.json()).items||[]).filter(c=>c.selected||c.primary), out=[];
  await Promise.all(cals.map(async c=>{
    const u='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(c.id)+'/events?singleEvents=true&orderBy=startTime&maxResults=150&timeMin='+encodeURIComponent(min.toISOString())+'&timeMax='+encodeURIComponent(max.toISOString());
    const r=await fetch(u,{headers:h});if(!r.ok)return;
    ((await r.json()).items||[]).forEach(ev=>{
      if(ev.status==='cancelled'||!ev.start)return;
      const ad=!!ev.start.date, s=ad?gcPd(ev.start.date):new Date(ev.start.dateTime), e=ad?gcPd(ev.end.date):new Date(ev.end.dateTime);
      out.push({t:ev.summary||'(Sin título)',s:+s,e:+e,a:ad});
    });
  }));
  out.sort((a,b)=>a.s-b.s);
  gEvents=out;gcSaveCache();
}

async function gcRefresh(){
  if(gBusy||!gcTokenOk())return;
  gBusy=true;
  try{await gcFetchAll();}
  catch(e){if(gUserClick)gcMsg('No se pudieron leer los eventos. Intenta de nuevo.');}
  gBusy=false;gcRender();
}

function gcInit(){
  if(gClient||!window.google||!google.accounts||!google.accounts.oauth2)return;
  gClient=google.accounts.oauth2.initTokenClient({
    client_id:GC_ID,scope:GC_SCOPE,
    callback:resp=>{
      if(resp.error||!resp.access_token){if(gUserClick)gcMsg('No se pudo conectar con Google.');return;}
      gToken=resp.access_token;gTokenExp=Date.now()+(+resp.expires_in||3600)*1000;
      try{localStorage.setItem('relojGcal','1');}catch(e){}
      gcRefresh();
    },
    error_callback:()=>{if(gUserClick)gcMsg('Se cerró la ventana de Google sin conectar.');}
  });
  if(gcConnected())gClient.requestAccessToken({prompt:''});
}

function gcLoadScript(){
  if(window.google&&google.accounts){gcInit();return;}
  const s=document.createElement('script');
  s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=gcInit;
  document.head.appendChild(s);
}

document.getElementById('gcalBtn').addEventListener('click',()=>{
  gUserClick=true;
  if(!gClient){gcLoadScript();gcMsg('Cargando Google… vuelve a pulsar en un momento.');return;}
  if(gcTokenOk()){gcRefresh();return;}
  gClient.requestAccessToken({prompt:gcConnected()?'':'consent'});
});
document.getElementById('gcalOff').addEventListener('click',()=>{
  try{if(gToken&&window.google)google.accounts.oauth2.revoke(gToken,()=>{});}catch(e){}
  gToken=null;gTokenExp=0;gEvents=[];
  try{localStorage.removeItem('relojGcal');localStorage.removeItem('relojGcalEvents');}catch(e){}
  gcRender();
});
setInterval(()=>{if(gcTokenOk())gcRefresh();},600000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gcConnected()&&!gcTokenOk()&&gClient){gUserClick=false;try{gClient.requestAccessToken({prompt:''});}catch(e){}}});
gcLoadCache();gcRender();gcLoadScript();
drawSky();

window.addEventListener('scroll',drawSky,{passive:true});
setInterval(drawSky,60000);
